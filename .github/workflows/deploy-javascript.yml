name: Deploy Brevit.js to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      working-directory: Brevit.js
      run: npm ci
    
    - name: Run tests
      working-directory: Brevit.js
      run: npm test
    
    - name: Publish to npm
      working-directory: Brevit.js
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

