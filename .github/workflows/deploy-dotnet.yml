name: Deploy Brevit.NET to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: |
        dotnet restore Brevit.NET/Brevit.NET.csproj
        dotnet restore Brevit.NET.Tests/Brevit.NET.Tests.csproj
    
    - name: Build
      run: dotnet build Brevit.NET/Brevit.NET.csproj --no-restore --configuration Release
    
    - name: Test
      run: dotnet test Brevit.NET.Tests/Brevit.NET.Tests.csproj --no-restore --configuration Release --verbosity normal
    
    - name: Pack
      run: dotnet pack Brevit.NET/Brevit.NET.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
