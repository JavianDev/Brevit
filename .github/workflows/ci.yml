name: CI - All Projects

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  dotnet:
    name: .NET Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: |
        dotnet restore Brevit.NET/Brevit.NET.csproj
        dotnet restore Brevit.NET.Tests/Brevit.NET.Tests.csproj
    - name: Build
      run: |
        dotnet build Brevit.NET/Brevit.NET.csproj --no-restore --configuration Release
        dotnet build Brevit.NET.Tests/Brevit.NET.Tests.csproj --no-restore --configuration Release
    - name: Test
      run: dotnet test Brevit.NET.Tests/Brevit.NET.Tests.csproj --no-build --configuration Release --verbosity normal

  javascript:
    name: JavaScript Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      working-directory: Brevit.js
      run: npm install
    - name: Run tests
      working-directory: Brevit.js
      run: npm test

  python:
    name: Python Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      working-directory: Brevit.py
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -e .
    - name: Run tests
      working-directory: Brevit.py
      run: pytest tests/ -v

